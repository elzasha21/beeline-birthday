<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffcc00" />
  <meta name="description" content="Поздравление с днём рождения — С днём рождения! İyi ki doğdun!" />
  <title>С днём рождения! · İyi ki doğdun!</title>
  <style>
    :root { --yellow:#ffcc00; --black:#161616; --white:#fff; }
    * { box-sizing:border-box; }
    html,body {margin:0;min-height:100%;}
    body {font-family:Arial,Helvetica,sans-serif;background:var(--yellow);color:var(--black);overflow-x:hidden;}
    .page {min-height:100svh; min-height:100dvh; display:flex;align-items:center;justify-content:center;position:relative;isolation:isolate;padding:72px 22px 80px;overflow:hidden;}
    .glow {position:absolute;inset:-30%;z-index:-3;background:radial-gradient(circle at 45% 34%,#ffe987 0%,#ffdb3a 24%,var(--yellow) 60%);}
    .ball {width:96px;height:96px;position:absolute;z-index:-2;top:17%;left:50%;transform:translateX(-50%);animation:float 6s ease-in-out infinite;filter:drop-shadow(0 12px 16px rgba(80,55,0,.15));}
    .ball svg {display:block;width:100%;height:100%;}
    .confetti {position:absolute;inset:0;pointer-events:none;z-index:-1;overflow:hidden;}
    .piece {position:absolute;top:-30px;width:9px;height:17px;background:#fff;border-radius:3px;opacity:.85;animation:fall var(--duration) linear infinite;animation-delay:var(--delay);left:var(--left);transform:rotate(var(--rotate));}
    .piece:nth-child(3n){background:#161616;width:6px;height:13px;}
    .piece:nth-child(4n){background:#f5a800;width:11px;height:11px;border-radius:50%;}
    .content {width:min(100%,430px);text-align:center;position:relative;margin-top:100px;}
    h1 {font-size:clamp(43px,12.2vw,68px);line-height:.98;letter-spacing:-.065em;margin:0;font-weight:900;text-wrap:balance;}
    .divider {width:48px;height:5px;background:#161616;border-radius:6px;margin:25px auto;}
    .turkish {font-size:clamp(29px,8.1vw,42px);line-height:1.06;font-weight:900;letter-spacing:-.055em;margin:0;}
    .subtitle {font-size:14px;line-height:1.5;margin:24px auto 0;max-width:290px;font-weight:500;}
    @keyframes float {0%,100%{transform:translate(-50%,0) rotate(-8deg)}50%{transform:translate(-50%,-16px) rotate(6deg)}}
    @keyframes fall {from{translate:0 -30px;rotate:0deg}to{translate:35px 110vh;rotate:720deg}}
    @media(max-height:690px){.page{padding-top:35px;padding-bottom:45px}.ball{width:70px;height:70px;top:9%}.content{margin-top:80px}.divider{margin:17px auto}.subtitle{margin-top:16px}}.ball{width:min(80vw,350px);top:3%}.content{margin-top:145px}.divider{margin:17px auto}.subtitle{margin-top:16px}}
    @media(prefers-reduced-motion:reduce){.ball,.piece{animation:none}.piece{display:none}}
  </style>
</head>
<body>
  <main class="page">
    <div class="glow" aria-hidden="true"></div>
    <div class="ball" aria-hidden="true"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">

</svg>
</div>
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <section class="content" aria-label="Поздравление с днём рождения">
      <h1>С днём<br>рождения!</h1>
      <div class="divider"></div>
      <p class="turkish" lang="tr">İyi ki doğdun!</p>
      <p class="subtitle">Пусть впереди будет много ярких моментов, улыбок и счастливых событий!</p>
    </section>
  </main>
  <script>
    const container=document.getElementById('confetti');
    if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      for(let i=0;i<22;i++){
        const p=document.createElement('i');p.className='piece';
        p.style.setProperty('--left',Math.random()*100+'%');
        p.style.setProperty('--duration',(6+Math.random()*8)+'s');
        p.style.setProperty('--delay',(-Math.random()*15)+'s');
        p.style.setProperty('--rotate',Math.random()*360+'deg');
        container.appendChild(p);
      }
    }
  </script>
</body>
</html>
